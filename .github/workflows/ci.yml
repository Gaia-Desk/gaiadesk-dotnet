name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GaiaDesk.sln
      - name: Build (net8.0 and netstandard2.1, zero warnings)
        run: dotnet build GaiaDesk.sln -c Release --no-restore
      - name: Test
        run: dotnet test GaiaDesk.sln -c Release --no-build --blame-hang-timeout 5m
      - name: Pack
        run: dotnet pack src/GaiaDesk/GaiaDesk.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*
